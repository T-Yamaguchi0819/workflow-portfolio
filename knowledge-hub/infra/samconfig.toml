version = 0.1

[default.deploy.parameters]
stack_name = "knowledge-hub"
resolve_s3 = true
s3_prefix = "knowledge-hub"
region = "ap-northeast-1"
# NOTE: Keep this file ASCII-only (SAM CLI on Windows reads it with cp932).
# Do not set "profile" here: GitHub Actions uses OIDC env credentials.
# For local deploys, pass it explicitly: sam deploy --profile portfolio
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = "CorsAllowedOrigin=\"https://main.d1e1o87p5asykz.amplifyapp.com\""
image_repositories = []

[default.global.parameters]
region = "ap-northeast-1"

# Shared dev environment for ai/* branches: sam deploy --config-env dev
# No parameter_overrides: CorsAllowedOrigin stays at the template default
# (API is called via SSR only, no direct browser access to the dev API).
[dev.deploy.parameters]
stack_name = "knowledge-hub-dev"
resolve_s3 = true
s3_prefix = "knowledge-hub-dev"
region = "ap-northeast-1"
confirm_changeset = false
capabilities = "CAPABILITY_IAM"
image_repositories = []
