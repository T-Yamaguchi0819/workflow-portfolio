AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
# NOTE: Keep this file ASCII-only. SAM CLI on Windows reads templates with the
# system locale encoding (cp932), so non-ASCII characters break `sam deploy`.
Description: >
  knowledge-hub - Internal knowledge/FAQ API (Spring Boot on Lambda + DynamoDB).
  Designed to fit the AWS always-free tier: Lambda 1M req/month, DynamoDB
  provisioned 25 RCU/WCU, API Gateway HTTP API (12-month free tier).

Parameters:
  CorsAllowedOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Origin of the Next.js frontend

Globals:
  Function:
    Timeout: 30
    # New AWS accounts start with a 512MB Lambda memory quota. Raise this to
    # 1024 after a Service Quotas increase if cold starts need to be faster.
    MemorySize: 512

Resources:
  ArticlesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: knowledge-hub-articles
      # Stay within the always-free tier (25 RCU / 25 WCU per account):
      # table 5+5 and GSI 5+5 = 10 RCU / 10 WCU total. Do NOT switch to
      # on-demand billing (not covered by the always-free tier).
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: category
          AttributeType: S
        - AttributeName: updatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: category-index
          KeySchema:
            - AttributeName: category
              KeyType: HASH
            - AttributeName: updatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: knowledge-hub-api
      Handler: com.knowledgehub.api.StreamLambdaHandler::handleRequest
      Runtime: java21
      CodeUri: ../backend/target/knowledge-hub-api-0.1.0-lambda.jar
      # SnapStart mitigates JVM cold starts (no extra cost for Java runtimes)
      SnapStart:
        ApplyOn: PublishedVersions
      AutoPublishAlias: live
      Environment:
        Variables:
          SPRING_PROFILES_ACTIVE: prod
          TABLE_NAME: !Ref ArticlesTable
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigin
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArticlesTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: ANY

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: knowledge-hub-http-api

Outputs:
  ApiEndpoint:
    Description: Base URL of the API (set as API_BASE_URL in the frontend)
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  TableName:
    Description: DynamoDB table name
    Value: !Ref ArticlesTable
