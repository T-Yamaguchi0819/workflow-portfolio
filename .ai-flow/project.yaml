# =============================================================================
# project.yaml — プロジェクト適用設定
# =============================================================================
# ai-dev-flow のフロー定義（FLOW.md / flow/ / roles/）はエージェント・プロジェクト
# 非依存で書かれており、プロジェクト固有の値はすべて本ファイルに集約する。
# 機械検査する禁止パターンは guards/guard-rules.json に定義する（本ファイルの
# constraints は AI が読むための宣言、guard-rules.json は機械が検査する実装）。
# =============================================================================

project:
  name: "workflow-portfolio"
  description: "ai-dev-flow（AI修正フロー汎用パッケージ）と knowledge-hub（ポートフォリオ用ナレッジ/FAQ管理Webアプリ）のモノレポ"
  # システムの重要度。フロー全体の慎重さ（ゲートの厳格さ）の根拠になる
  criticality: "ポートフォリオ/公開デモ用途（顧客データなし）。ただし公開リポジトリとして品質そのものが成果物であり、CI 破壊と秘密情報の混入は許容しない"
  # ユーザーとの対話言語（思考言語はエージェント任せでよい）
  language: "日本語"

# 対象リポジトリ（複数可）。path は本ファイルのあるプロジェクトルートからの相対
repos:
  - path: "."
    stack: "backend: Java 21 / Spring Boot 3.5 / DynamoDB (Enhanced Client)、frontend: Next.js 15 (App Router, SSR) / TypeScript、infra: AWS SAM (Lambda + API Gateway + DynamoDB)"
    notes: "アプリ本体は knowledge-hub/ 配下（backend / frontend / infra）。ルート直下の .ai-flow/ と adapters/ は ai-dev-flow パッケージの開発元であり、プロジェクト固有値を書き込まない"

git:
  # 修正時に必ず切るブランチのプレフィックス
  branch_prefix: "ai/"
  # コミットメッセージ書式（1行目の形式と本文の必須事項）
  commit_format: |
    1行目「{scope}: {修正概要}」。scope は knowledge-hub / ai-flow / ci / docs のいずれか
    本文に Why（なぜこの変更が必要か＝背景・目的）を必ず含める（What の羅列だけにしない）
  # コミット/push/PR の承認モード（運用ルールは FLOW.md「コミットポリシーと PR 運用」節が正）
  commit_policy: "manual"
  # コミットに含めてはいけないもの
  commit_excludes:
    - "ビルド生成物（knowledge-hub/backend/target/・knowledge-hub/frontend/.next/・node_modules/）"
    - "環境ローカル設定（.env・.env*.local。frontend/.env.local は開発機固有のポート設定）"
    - "AWS 認証情報・API キー等の秘密情報（いかなる形でも）"

# GitHub Issue ミラー（人間向け可視化・承認チャネル）
issue_sync:
  enabled: false          # GitHub リポジトリ公開後に有効化を検討（gh CLI 認証済み）
  repo: ""
  labels: ["ai-flow"]

# PR 運用（git.commit_policy: auto の場合に使用。テンプレートは templates/pr.md）
pr:
  base: ""
  draft: false
  ai_review: true

build:
  # コンパイル・ビルド確認のコマンド（[4]実装の完了条件で使う）
  # 注意: 開発機固有の JAVA_HOME/PORT 設定は .claude/CLAUDE.md「ビルド・実行コマンド」参照
  compile_command: "backend: mvn -q compile（knowledge-hub/backend で実行）／ frontend: npm run typecheck && npm run build（knowledge-hub/frontend で実行）"
  # 自動テストの実行コマンド（[3][6] で使う）
  test_command: "backend: mvn test（knowledge-hub/backend で実行）"
  # テストコードの置き場所・命名規則
  test_location: "knowledge-hub/backend/src/test/java 配下。サービス層は {対象}Test のユニットテスト、API は MockMvc の {対象}ControllerTest"

verify:
  # [6]動作確認の方法
  method: "ローカルで両サーバーを起動しブラウザで確認（backend: PORT=8081 mvn spring-boot:run ／ frontend: npm run dev → http://localhost:3000）。CRUD と検索の通しを最低限確認する"
  # エビデンス（キャプチャ・ログ）の保存先
  evidence_dir: ".ai-flow/work/{タスク名}/evidence/"
  # ローカル起動手順の参照先
  local_env: "knowledge-hub/README.md（汎用手順）と .claude/CLAUDE.md（この開発機固有の JAVA_HOME・ポート事情）"

# [7]ドキュメント反映
docs:
  enabled: true
  targets:
    - name: "Knowledge Hub 設計書（基本設計）"
      location: "knowledge-hub/docs/設計書.md"
      format: "markdown"
      sample: ""
      style: ""
      templates: []
      notes: "機能・画面・API・データ・モジュール構成を変えたら該当節を必ず更新。§9.4（割り切りと拡張方針）は実装との乖離が出やすいので注意"
    - name: "テーブル定義書（DynamoDB）"
      location: "knowledge-hub/docs/テーブル定義書.md"
      format: "markdown"
      sample: ""
      style: ""
      templates: []
      notes: "定義の正は infra/template.yaml。属性・インデックス・キャパシティを変えたら template.yaml と本書を同時に更新する"
    - name: "画面設計書（画面単位。S-01〜S-04）"
      location: "knowledge-hub/docs/screens/"
      format: "markdown"
      sample: ""
      style: ""
      templates: []
      notes: "1画面1ファイル。画面の項目・イベント・メッセージ・遷移を変えたら該当画面のファイルを更新。画面を追加したら採番して新規作成し、設計書.md §3.1 の一覧にも行を追加。S-04 は S-03 との差分定義形式"
    - name: "Knowledge Hub README（アーキテクチャ・API仕様・手順）"
      location: "knowledge-hub/README.md"
      format: "markdown"
      sample: ""
      style: ""
      templates: []
      notes: "API のエンドポイント・パラメータを変えたら「API 仕様」表を必ず更新。インフラ変更時は無料枠の根拠の記述も見直す"
    - name: "ルート README（リポジトリ全体の案内）"
      location: "README.md"
      format: "markdown"
      sample: ""
      style: ""
      templates: []
      notes: "ディレクトリ構成が変わった場合のみ更新"
  policy: "なし（Markdown を直接更新）"
  excel_write_policy: "対象外（Excel ドキュメントなし）"

# プロジェクト固有の絶対禁止事項・必須パターン（AI が全フェーズで遵守する宣言）。
# 機械検出可能なものは guards/guard-rules.json にも必ず定義する
constraints:
  forbidden:
    - "秘密情報（AWS アクセスキー等）のハードコード禁止（環境変数・.env 経由とし、.env は git 管理外）"
    - "DynamoDB をオンデマンド課金モードに変更しない（常時無料枠のプロビジョンド 25RCU/WCU 内に収める設計が前提。guard-rules.json の dynamodb-on-demand で機械検査）"
    - "フロントエンドの SPA 化禁止（SSR + Server Actions を維持。クライアントコンポーネントは confirm・フォームエラー表示等の最小限に留める）"
    - "ai-dev-flow パッケージ側（.ai-flow/flow/ roles/ templates/ 等の配布物）にプロジェクト固有値を書き込まない（固有値は本ファイルに集約する設計）"
  required:
    - "API エラーレスポンスは {\"message\": ..., \"errors\": [...]} 形式を維持（ApiExceptionHandler で統一）"
    - "日時は UTC の Instant で保存し、表示側でロケール変換する"
    - "バックエンドの挙動変更にはテストを追随させる（mvn test が通ること）"
  # バージョン起因等の「事故多発ポイント」
  pitfalls:
    - "開発機のポート 8080 は Oracle TNS Listener が占有。バックエンドは PORT=8081 で起動（8080 決め打ちにしない）"
    - "システム Java は 1.8。mvn 実行前に JAVA_HOME=C:\\workspace\\tools\\jdk-21 の設定が必要"
    - "\"use server\" ファイル（frontend/src/lib/actions.ts）から async 関数以外を export するとビルドが落ちる（Next.js の制約）"

# リスク判定（[2]Plan で使用。High 以上は独立レビュー必須、Critical は人間レビュー必須）
risk:
  critical:
    - "認証・認可（導入する場合）"
    - "インフラ定義（infra/template.yaml）のうち課金に影響する変更（キャパシティ・課金モード・リージョン追加）"
    - "CI/CD からの AWS 認証情報の扱い"
  high:
    - "DynamoDB アクセス層（DynamoDbArticleRepository・テーブル/GSI 定義）"
    - "Server Actions のデータ変更処理（create/update/delete）"
    - "API のリクエスト/レスポンス形式の変更（フロントとの整合が必要）"
  # 上記に該当しないロジック変更は Medium、文言・スタイル・コメントのみは Low

flow:
  # 作業ディレクトリ（状態・成果物の置き場）
  work_dir: ".ai-flow/work"
  # 規模判定に迷った場合のデフォルト
  size_default: "M"

# フロー評価（実績.md の metrics ブロックを evaluate_flow.py が集計し、目標と突合する）
evaluation:
  review_cycle: 10
  targets:
    reduction_pct_min: 50        # 工数削減率（平均）の下限（%）
    first_pass_rate_min: 70      # 初回PASS率の下限（%）
    human_findings_avg_max: 1.0  # 1タスクあたりの人間追加指摘の上限（平均・件）
    rework_avg_max: 1.0          # 平均手戻り回数の上限（回）
